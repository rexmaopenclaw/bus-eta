<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // SPA fallback for GitHub Pages: redirect to index.html with path as query param
    var path = window.location.pathname.replace('/bus-eta/', '');
    if (path && path !== '' && path !== 'index.html' && path !== '404.html') {
      window.location.replace('/bus-eta/?p=' + path + window.location.hash);
    }
  </script>
</head>
<body>
  <p>Redirecting to <a href="/bus-eta/">巴士到站</a>...</p>
</body>
</html>
